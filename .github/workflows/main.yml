name: Demo pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "Event ${{ github.event_name }} on ${{ github.ref }} by ${{ github.actor }}"
      - name: List files
        run: ls -la
